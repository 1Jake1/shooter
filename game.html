<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>FPS Шутер</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				overflow: hidden;
				background: #000;
				font-family: 'Segoe UI', Arial, sans-serif;
				cursor: default;
			}
			body.in-game {
				cursor: none;
			}

			#hud {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 50;
			}
			#crosshair {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 24px;
				height: 24px;
				transition: opacity 0.15s;
			}
			#crosshair::before,
			#crosshair::after {
				content: '';
				position: absolute;
				background: rgba(255, 255, 255, 0.9);
			}
			#crosshair::before {
				width: 2px;
				height: 100%;
				left: 50%;
				transform: translateX(-50%);
			}
			#crosshair::after {
				height: 2px;
				width: 100%;
				top: 50%;
				transform: translateY(-50%);
			}
			#crosshair .dot {
				position: absolute;
				width: 3px;
				height: 3px;
				background: #ff4444;
				border-radius: 50%;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
			}
			#crosshair.hidden {
				opacity: 0;
			}

			#weapon-hud {
				position: absolute;
				bottom: 30px;
				right: 40px;
				text-align: right;
				color: #fff;
			}
			#weapon-name {
				font-size: 13px;
				color: #ff8800;
				letter-spacing: 3px;
				text-transform: uppercase;
				font-weight: bold;
			}
			#ammo-display {
				font-size: 48px;
				font-weight: 900;
				line-height: 1;
				text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
			}
			#ammo-display .reserve {
				font-size: 20px;
				color: #888;
				font-weight: 400;
			}
			#weapon-slots {
				display: flex;
				gap: 6px;
				margin-top: 10px;
				justify-content: flex-end;
				flex-wrap: wrap;
			}
			.weapon-slot {
				background: rgba(255, 255, 255, 0.08);
				border: 1px solid rgba(255, 255, 255, 0.15);
				padding: 5px 10px;
				border-radius: 6px;
				font-size: 11px;
				color: #888;
				transition: all 0.2s;
			}
			.weapon-slot.active {
				background: rgba(255, 68, 68, 0.2);
				border-color: #ff4444;
				color: #fff;
			}
			.weapon-slot.frag.active {
				background: rgba(255, 150, 0, 0.2);
				border-color: #ff9900;
			}
			.weapon-slot.smoke.active {
				background: rgba(150, 200, 255, 0.2);
				border-color: #88bbff;
			}
			.weapon-slot.ssg.active {
				background: rgba(180, 100, 255, 0.2);
				border-color: #aa66ff;
			}

			#health-bar {
				position: absolute;
				bottom: 30px;
				left: 40px;
			}
			#health-bar .label {
				font-size: 11px;
				color: #888;
				letter-spacing: 2px;
				text-transform: uppercase;
			}
			#health-bar .value {
				font-size: 42px;
				font-weight: 900;
				color: #44ff44;
			}
			#score-display {
				position: absolute;
				top: 30px;
				right: 40px;
				text-align: right;
				color: #fff;
			}
			#score-display .label {
				font-size: 11px;
				color: #888;
				letter-spacing: 2px;
				text-transform: uppercase;
			}
			#score-display .value {
				font-size: 36px;
				font-weight: 900;
				color: #ff8800;
			}

			#team-score {
				position: absolute;
				top: 30px;
				left: 50%;
				transform: translateX(-50%);
				display: none;
				gap: 20px;
				align-items: center;
				font-size: 28px;
				font-weight: 900;
			}
			#team-score.show {
				display: flex;
			}
			#team-score .red-score {
				color: #ff4444;
			}
			#team-score .vs {
				color: #666;
				font-size: 16px;
			}
			#team-score .blue-score {
				color: #4488ff;
			}

			#hit-marker {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 30px;
				height: 30px;
				opacity: 0;
				transition: opacity 0.1s;
			}
			#hit-marker.show {
				opacity: 1;
			}
			#hit-marker::before,
			#hit-marker::after {
				content: '';
				position: absolute;
				background: #ff4444;
			}
			#hit-marker::before {
				width: 2px;
				height: 12px;
				top: 0;
				left: 50%;
				transform: translateX(-50%);
			}
			#hit-marker::after {
				width: 2px;
				height: 12px;
				bottom: 0;
				left: 50%;
				transform: translateX(-50%);
			}
			#hit-marker .h1 {
				position: absolute;
				width: 12px;
				height: 2px;
				top: 50%;
				left: 0;
				transform: translateY(-50%);
				background: #ff4444;
			}
			#hit-marker .h2 {
				position: absolute;
				width: 12px;
				height: 2px;
				top: 50%;
				right: 0;
				transform: translateY(-50%);
				background: #ff4444;
			}

			#damage-overlay {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 40;
				background: radial-gradient(
					ellipse at center,
					transparent 50%,
					rgba(255, 0, 0, 0.3) 100%
				);
				opacity: 0;
				transition: opacity 0.3s;
			}
			#damage-overlay.show {
				opacity: 1;
			}

			#death-screen {
				position: fixed;
				inset: 0;
				z-index: 60;
				background: rgba(0, 0, 0, 0.85);
				display: none;
				align-items: center;
				justify-content: center;
				flex-direction: column;
				gap: 20px;
			}
			#death-screen.show {
				display: flex;
			}
			#death-screen .title {
				font-size: 64px;
				font-weight: 900;
				color: #ff4444;
				letter-spacing: 8px;
				text-transform: uppercase;
			}
			#death-screen .killer {
				font-size: 18px;
				color: #888;
				letter-spacing: 2px;
			}
			#death-screen .respawn-timer {
				font-size: 48px;
				font-weight: bold;
				color: #ff8800;
				margin-top: 20px;
			}

			#reload-bar-container {
				position: absolute;
				bottom: 120px;
				left: 50%;
				transform: translateX(-50%);
				width: 200px;
				height: 6px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 3px;
				overflow: hidden;
				opacity: 0;
				transition: opacity 0.3s;
			}
			#reload-bar-container.show {
				opacity: 1;
			}
			#reload-bar {
				height: 100%;
				width: 0%;
				background: linear-gradient(90deg, #ff4444, #ff8800);
				border-radius: 3px;
				transition: width 0.05s linear;
			}
			#reload-text {
				position: absolute;
				bottom: 132px;
				left: 50%;
				transform: translateX(-50%);
				color: #ff8800;
				font-size: 13px;
				letter-spacing: 3px;
				text-transform: uppercase;
				opacity: 0;
				transition: opacity 0.2s;
				font-weight: bold;
			}
			#reload-text.show {
				opacity: 1;
			}

			#minimap {
				position: absolute;
				top: 30px;
				left: 30px;
				width: 150px;
				height: 150px;
				background: rgba(0, 0, 0, 0.6);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 8px;
				overflow: hidden;
			}
			#minimap canvas {
				width: 100%;
				height: 100%;
			}

			#throw-indicator {
				position: absolute;
				bottom: 180px;
				left: 50%;
				transform: translateX(-50%);
				color: #ffcc00;
				font-size: 12px;
				letter-spacing: 2px;
				text-transform: uppercase;
				opacity: 0;
				transition: opacity 0.2s;
				font-weight: bold;
			}
			#throw-indicator.show {
				opacity: 1;
			}

			#zombie-ui {
				position: absolute;
				top: 30px;
				left: 50%;
				transform: translateX(-50%);
				display: none;
				gap: 30px;
				align-items: center;
				font-size: 20px;
				font-weight: 900;
				color: #88ff88;
			}
			#zombie-ui.show {
				display: flex;
			}
			#zombie-ui .wave {
				text-shadow: 0 0 10px rgba(136, 255, 136, 0.5);
			}
			#zombie-ui .kills {
				color: #ff8800;
				text-shadow: 0 0 10px rgba(255, 136, 0, 0.5);
			}

			#smoke-overlay {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 45;
				background: radial-gradient(
					ellipse at center,
					rgba(200, 200, 200, 0.92) 0%,
					rgba(150, 150, 150, 0.97) 100%
				);
				opacity: 0;
				transition: opacity 0.5s;
			}

			#scope-overlay {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 48;
				opacity: 0;
				transition: opacity 0.2s;
			}
			#scope-overlay.active {
				opacity: 1;
			}
			#scope-overlay .scope-bg {
				position: absolute;
				inset: 0;
				background: radial-gradient(
					circle at center,
					transparent 28%,
					rgba(0, 0, 0, 0.95) 32%
				);
			}
			#scope-overlay .scope-cross-h {
				position: absolute;
				top: 50%;
				left: 0;
				right: 0;
				height: 1px;
				background: rgba(0, 0, 0, 0.8);
			}
			#scope-overlay .scope-cross-v {
				position: absolute;
				left: 50%;
				top: 0;
				bottom: 0;
				width: 1px;
				background: rgba(0, 0, 0, 0.8);
			}
			#scope-overlay .scope-center {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 3px;
				height: 3px;
				background: #ff0000;
				border-radius: 50%;
			}

			#loading-screen {
				position: fixed;
				inset: 0;
				z-index: 100;
				background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
				display: flex;
				align-items: center;
				justify-content: center;
				transition: opacity 0.5s;
			}
			#loading-screen.hidden {
				opacity: 0;
				pointer-events: none;
			}
			.loading-content {
				text-align: center;
				max-width: 500px;
				padding: 40px;
			}
			.loading-title {
				font-size: 32px;
				font-weight: 900;
				color: #ff8800;
				letter-spacing: 4px;
				margin-bottom: 30px;
				text-transform: uppercase;
			}
			.loading-progress-container {
				width: 100%;
				height: 8px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 4px;
				overflow: hidden;
				margin-bottom: 20px;
			}
			#loading-progress-bar {
				height: 100%;
				width: 0%;
				background: linear-gradient(90deg, #ff4444, #ff8800);
				border-radius: 4px;
				transition: width 0.3s ease;
			}
			#loading-status {
				font-size: 14px;
				color: #888;
				letter-spacing: 2px;
				text-transform: uppercase;
				margin-bottom: 10px;
			}
			#loading-percentage {
				font-size: 48px;
				font-weight: 900;
				color: #fff;
				margin-bottom: 20px;
			}
			#players-ready-status {
				font-size: 16px;
				color: #4488ff;
				letter-spacing: 1px;
				margin-top: 20px;
				min-height: 24px;
			}
		</style>
	</head>
	<body>
		<div id="hud">
			<div id="crosshair"><div class="dot"></div></div>
			<div id="hit-marker">
				<div class="h1"></div>
				<div class="h2"></div>
			</div>
			<div id="reload-text">ПЕРЕЗАРЯДКА</div>
			<div id="reload-bar-container"><div id="reload-bar"></div></div>
			<div id="throw-indicator">УДЕРЖИВАЙТЕ ЛКМ ДЛЯ БРОСКА</div>
			<div id="weapon-hud">
				<div id="weapon-name">ПИСТОЛЕТ</div>
				<div id="ammo-display">
					<span id="ammo-current">12</span>
					<span class="reserve">/ <span id="ammo-reserve">∞</span></span>
				</div>
				<div id="weapon-slots">
					<div class="weapon-slot active" id="slot-1">1 ПИСТ</div>
					<div class="weapon-slot" id="slot-2">2 АВТ</div>
					<div class="weapon-slot ssg" id="slot-3">3 SSG</div>
					<div class="weapon-slot frag" id="slot-4">4 ОСК.</div>
					<div class="weapon-slot smoke" id="slot-5">5 ДЫМ.</div>
				</div>
			</div>
			<div id="health-bar">
				<div class="label">ЗДОРОВЬЕ</div>
				<div class="value" id="health-value">100</div>
			</div>
			<div id="score-display">
				<div class="label">СЧЁТ</div>
				<div class="value" id="score-value">0</div>
			</div>
			<div id="team-score">
				<span class="red-score" id="red-score-val">0</span>
				<span class="vs">VS</span>
				<span class="blue-score" id="blue-score-val">0</span>
			</div>
			<div id="zombie-ui">
				<div class="wave" id="zombie-wave">Волна: 1</div>
				<div class="kills" id="zombies-killed">Убито: 0</div>
			</div>
			<div id="minimap">
				<canvas id="minimap-canvas" width="150" height="150"></canvas>
			</div>
		</div>

		<div id="damage-overlay"></div>
		<div id="smoke-overlay"></div>

		<div id="death-screen">
			<div class="title">УБИТ</div>
			<div class="killer" id="killer-name">Убит игроком</div>
			<div class="respawn-timer" id="respawn-timer">2</div>
		</div>

		<div id="scope-overlay">
			<div class="scope-bg"></div>
			<div class="scope-cross-h"></div>
			<div class="scope-cross-v"></div>
			<div class="scope-center"></div>
		</div>

		<div id="loading-screen">
			<div class="loading-content">
				<div class="loading-title">ЗАГРУЗКА РЕСУРСОВ</div>
				<div class="loading-progress-container">
					<div id="loading-progress-bar"></div>
				</div>
				<div id="loading-status">Инициализация...</div>
				<div id="loading-percentage">0%</div>
				<div id="players-ready-status"></div>
			</div>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.3/umd/index.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
		<script src="/socket.io/socket.io.js"></script>
		<script>
			// Получить параметры из URL
			const urlParams = new URLSearchParams(window.location.search);
			const lobbyId = urlParams.get('lobby');
			const selectedMap = parseInt(urlParams.get('map')) || 1;
			const selectedTeam = urlParams.get('team') || 'red';
			const enableBots = urlParams.get('bots') === 'true';

			// Socket.IO подключение - автоматически использует текущий домен
			const socket = io({
				transports: ['websocket', 'polling']
			});
		</script>
		<script src="game-client.js"></script>
	</body>
</html>
