<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>FPS Шутер - Лобби</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
				font-family: 'Segoe UI', Arial, sans-serif;
				color: #fff;
				min-height: 100vh;
				padding: 20px;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
			}
			h1 {
				text-align: center;
				font-size: 48px;
				font-weight: 900;
				letter-spacing: 4px;
				background: linear-gradient(135deg, #ff4444, #ff8800);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				margin-bottom: 10px;
			}
			.subtitle {
				text-align: center;
				color: #888;
				font-size: 12px;
				letter-spacing: 3px;
				margin-bottom: 40px;
			}

			.section {
				background: rgba(255, 255, 255, 0.04);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 12px;
				padding: 20px;
				margin-bottom: 20px;
			}
			.section h2 {
				font-size: 14px;
				color: #ff8800;
				letter-spacing: 3px;
				text-transform: uppercase;
				margin-bottom: 15px;
			}

			.input-group {
				margin-bottom: 15px;
			}
			.input-group label {
				display: block;
				margin-bottom: 8px;
				color: #ccc;
				font-size: 13px;
			}
			.input-group input {
				width: 100%;
				padding: 12px;
				background: rgba(255, 255, 255, 0.08);
				border: 1px solid rgba(255, 255, 255, 0.15);
				border-radius: 6px;
				color: #fff;
				font-size: 14px;
			}
			.input-group input:focus {
				outline: none;
				border-color: #ff8800;
			}

			.btn {
				background: linear-gradient(135deg, #ff4444, #cc2200);
				border: none;
				color: #fff;
				padding: 14px 40px;
				font-size: 16px;
				border-radius: 8px;
				cursor: pointer;
				letter-spacing: 2px;
				font-weight: bold;
				text-transform: uppercase;
				transition: all 0.3s;
				width: 100%;
			}
			.btn:hover {
				transform: scale(1.02);
				box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
			}
			.btn:disabled {
				opacity: 0.5;
				cursor: not-allowed;
				transform: none;
			}
			.btn-secondary {
				background: linear-gradient(135deg, #555, #333);
			}

			.lobbies-list {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
				gap: 15px;
				max-height: 400px;
				overflow-y: auto;
			}
			.lobby-card {
				background: rgba(255, 255, 255, 0.06);
				border: 2px solid rgba(255, 255, 255, 0.1);
				border-radius: 10px;
				padding: 15px;
				cursor: pointer;
				transition: all 0.2s;
			}
			.lobby-card:hover {
				border-color: #ff8800;
				background: rgba(255, 136, 0, 0.1);
			}
			.lobby-card-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 10px;
			}
			.lobby-id {
				font-size: 18px;
				font-weight: bold;
				color: #ff8800;
			}
			.lobby-players {
				font-size: 12px;
				color: #888;
			}
			.lobby-map {
				font-size: 13px;
				color: #ccc;
				margin-bottom: 5px;
			}
			.lobby-host {
				font-size: 11px;
				color: #666;
			}

			#lobby-screen {
				display: none;
			}
			.lobby-info {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 20px;
				margin-bottom: 20px;
			}
			.players-list {
				background: rgba(255, 255, 255, 0.04);
				border-radius: 8px;
				padding: 15px;
			}
			.player-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 10px;
				margin-bottom: 8px;
				background: rgba(255, 255, 255, 0.05);
				border-radius: 6px;
			}
			.player-name {
				font-size: 14px;
				color: #fff;
			}
			.player-team {
				font-size: 12px;
				padding: 4px 10px;
				border-radius: 4px;
				font-weight: bold;
			}
			.player-team.red {
				background: rgba(255, 68, 68, 0.3);
				color: #ff4444;
			}
			.player-team.blue {
				background: rgba(68, 136, 255, 0.3);
				color: #4488ff;
			}
			.player-team.none {
				background: rgba(136, 136, 136, 0.3);
				color: #888;
			}
			.player-host {
				background: rgba(255, 136, 0, 0.3);
				color: #ff8800;
				padding: 3px 8px;
				border-radius: 4px;
				font-size: 11px;
				margin-left: 10px;
			}

			.team-selector {
				display: flex;
				gap: 10px;
				margin-bottom: 15px;
			}
			.team-btn {
				flex: 1;
				padding: 12px;
				border: 2px solid rgba(255, 255, 255, 0.1);
				border-radius: 8px;
				background: rgba(255, 255, 255, 0.05);
				cursor: pointer;
				transition: all 0.2s;
				font-size: 14px;
				font-weight: bold;
			}
			.team-btn.red {
				border-color: rgba(255, 68, 68, 0.3);
				color: #ff4444;
			}
			.team-btn.red.selected {
				border-color: #ff4444;
				background: rgba(255, 68, 68, 0.2);
			}
			.team-btn.blue {
				border-color: rgba(68, 136, 255, 0.3);
				color: #4488ff;
			}
			.team-btn.blue.selected {
				border-color: #4488ff;
				background: rgba(68, 136, 255, 0.2);
			}

			.map-selector {
				display: flex;
				gap: 10px;
				margin-bottom: 15px;
			}
			.map-btn {
				flex: 1;
				padding: 15px;
				border: 2px solid rgba(255, 255, 255, 0.1);
				border-radius: 8px;
				background: rgba(255, 255, 255, 0.05);
				cursor: pointer;
				transition: all 0.2s;
				text-align: center;
			}
			.map-btn:hover {
				border-color: rgba(255, 136, 0, 0.5);
			}
			.map-btn.selected {
				border-color: #ff8800;
				background: rgba(255, 136, 0, 0.15);
			}
			.map-name {
				font-size: 16px;
				font-weight: bold;
				color: #fff;
				margin-bottom: 4px;
			}
			.map-desc {
				font-size: 11px;
				color: #888;
			}

			.checkbox-group {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 12px;
				background: rgba(255, 255, 255, 0.05);
				border-radius: 8px;
				margin-bottom: 15px;
			}
			.checkbox-group input[type='checkbox'] {
				width: 20px;
				height: 20px;
				cursor: pointer;
			}
			.checkbox-group label {
				font-size: 14px;
				color: #ccc;
				cursor: pointer;
			}

			.status-message {
				padding: 12px;
				border-radius: 6px;
				margin-bottom: 15px;
				text-align: center;
				font-size: 14px;
			}
			.status-error {
				background: rgba(255, 68, 68, 0.2);
				border: 1px solid #ff4444;
				color: #ff4444;
			}
			.status-success {
				background: rgba(68, 255, 68, 0.2);
				border: 1px solid #44ff44;
				color: #44ff44;
			}
			.status-info {
				background: rgba(68, 136, 255, 0.2);
				border: 1px solid #4488ff;
				color: #4488ff;
			}

			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div id="main-menu">
				<h1>ARENA FPS</h1>
				<div class="subtitle">ТАКТИЧЕСКИЙ ШУТЕР - МНОГОПОЛЬЗОВАТЕЛЬСКИЙ</div>

				<div class="section">
					<h2>Создать лобби</h2>
					<div class="input-group">
						<label>Ваше имя</label>
						<input
							type="text"
							id="player-name"
							placeholder="Введите ваше имя"
							maxlength="20"
						/>
					</div>
					<button class="btn" id="create-btn">Создать новое лобби</button>
				</div>

				<div class="section">
					<h2>Доступные лобби</h2>
					<div id="lobbies-list" class="lobbies-list"></div>
					<button
						class="btn btn-secondary"
						id="refresh-btn"
						style="margin-top: 15px"
					>
						Обновить список
					</button>
				</div>

				<div id="status-main" class="hidden"></div>
			</div>

			<div id="lobby-screen">
				<h1>ЛОББИ <span id="lobby-id-display"></span></h1>
				<div class="subtitle">ОЖИДАНИЕ ИГРОКОВ</div>

				<div id="status-lobby" class="hidden"></div>

				<div class="lobby-info">
					<div class="section">
						<h2>Игроки (<span id="player-count">0</span>/10)</h2>
						<div id="players-list" class="players-list"></div>
					</div>

					<div>
						<div class="section" id="host-controls">
							<h2>Настройки (только хост)</h2>
							<div class="map-selector">
								<div class="map-btn selected" data-map="1">
									<div class="map-name">🏟️ Арена</div>
									<div class="map-desc">Свободный бой</div>
								</div>
								<div class="map-btn" data-map="2">
									<div class="map-name">⚔️ Базы</div>
									<div class="map-desc">Командный бой</div>
								</div>
								<div class="map-btn" data-map="3">
									<div class="map-name">🧟 Зомби</div>
									<div class="map-desc">Выживание</div>
								</div>
							</div>
							<div class="checkbox-group">
								<input type="checkbox" id="enable-bots" />
								<label for="enable-bots">Включить манекены (цели)</label>
							</div>
						</div>

						<div class="section" id="team-section" style="display: none">
							<h2>Выбор команды</h2>
							<div class="team-selector">
								<button class="team-btn red" data-team="red">
									🔴 КРАСНЫЕ<br /><span style="font-size: 11px"
										>Западная база</span
									>
								</button>
								<button class="team-btn blue" data-team="blue">
									🔵 СИНИЕ<br /><span style="font-size: 11px"
										>Восточная база</span
									>
								</button>
							</div>
						</div>

						<div class="section">
							<button class="btn" id="start-game-btn" disabled>
								НАЧАТЬ ИГРУ
							</button>
							<button
								class="btn btn-secondary"
								id="leave-btn"
								style="margin-top: 10px"
							>
								Покинуть лобби
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="/socket.io/socket.io.js"></script>
		<script>
			// Socket.IO подключение - автоматически использует текущий домен
			const socket = io({
				transports: ['websocket', 'polling'],
			});
			let currentLobbyId = null;
			let playerName = '';
			let isHost = false;
			let currentLobby = null;

			// UI элементы
			const mainMenu = document.getElementById('main-menu');
			const lobbyScreen = document.getElementById('lobby-screen');
			const playerNameInput = document.getElementById('player-name');
			const createBtn = document.getElementById('create-btn');
			const refreshBtn = document.getElementById('refresh-btn');
			const lobbiesList = document.getElementById('lobbies-list');
			const lobbyIdDisplay = document.getElementById('lobby-id-display');
			const playersList = document.getElementById('players-list');
			const playerCount = document.getElementById('player-count');
			const startGameBtn = document.getElementById('start-game-btn');
			const leaveBtn = document.getElementById('leave-btn');
			const hostControls = document.getElementById('host-controls');
			const teamSection = document.getElementById('team-section');
			const statusMain = document.getElementById('status-main');
			const statusLobby = document.getElementById('status-lobby');

			// Сохранить имя в localStorage
			const savedName = localStorage.getItem('playerName');
			if (savedName) playerNameInput.value = savedName;

			// Создать лобби
			createBtn.addEventListener('click', () => {
				playerName = playerNameInput.value.trim();
				if (!playerName) {
					showStatus(statusMain, 'Введите ваше имя', 'error');
					return;
				}
				localStorage.setItem('playerName', playerName);
				socket.emit('create_lobby', { playerName });
			});

			// Обновить список лобби
			refreshBtn.addEventListener('click', () => {
				socket.emit('get_lobbies');
			});

			// Покинуть лобби
			leaveBtn.addEventListener('click', () => {
				socket.emit('leave_lobby');
				returnToMainMenu();
			});

			// Начать игру
			startGameBtn.addEventListener('click', () => {
				socket.emit('start_game');
			});

			// Выбор карты (только хост)
			document.querySelectorAll('.map-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					if (!isHost) return;
					document
						.querySelectorAll('.map-btn')
						.forEach(b => b.classList.remove('selected'));
					btn.classList.add('selected');
					const mapId = parseInt(btn.dataset.map);
					socket.emit('set_map', { mapId });
				});
			});

			// Включить манекены (только хост)
			document.getElementById('enable-bots').addEventListener('change', e => {
				if (!isHost) return;
				socket.emit('set_bots', { enableBots: e.target.checked });
			});

			// Выбор команды
			document.querySelectorAll('.team-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					document
						.querySelectorAll('.team-btn')
						.forEach(b => b.classList.remove('selected'));
					btn.classList.add('selected');
					socket.emit('set_team', { team: btn.dataset.team });
				});
			});

			// Socket events
			socket.on('lobby_created', ({ lobbyId, lobby }) => {
				currentLobbyId = lobbyId;
				isHost = true;
				currentLobby = lobby;
				showLobbyScreen();
				updateLobbyUI(lobby);
				showStatus(statusLobby, `Лобби создано! ID: ${lobbyId}`, 'success');
			});

			socket.on('lobby_joined', ({ lobby }) => {
				currentLobbyId = lobby.id;
				isHost = false;
				currentLobby = lobby;
				showLobbyScreen();
				updateLobbyUI(lobby);
				showStatus(statusLobby, 'Вы присоединились к лобби', 'success');
			});

			socket.on('lobbies_list', ({ lobbies }) => {
				renderLobbiesList(lobbies);
			});

			socket.on('lobby_updated', ({ lobby }) => {
				currentLobby = lobby;
				updateLobbyUI(lobby);
			});

			socket.on('player_disconnected', ({ playerId }) => {
				showStatus(statusLobby, 'Игрок покинул лобби', 'info');
			});

			socket.on('game_starting', ({ lobby, yourTeam }) => {
				// Переход к игре с командой, полученной от сервера
				const team = yourTeam || 'red';
				window.location.href = `/game.html?lobby=${lobby.id}&map=${lobby.selectedMap}&team=${team}&bots=${lobby.enableBots}`;
			});

			socket.on('error', ({ message }) => {
				if (currentLobbyId) {
					showStatus(statusLobby, message, 'error');
				} else {
					showStatus(statusMain, message, 'error');
				}
			});

			// Функции UI
			function showLobbyScreen() {
				mainMenu.style.display = 'none';
				lobbyScreen.style.display = 'block';
				lobbyIdDisplay.textContent = currentLobbyId;
			}

			function returnToMainMenu() {
				currentLobbyId = null;
				isHost = false;
				currentLobby = null;
				mainMenu.style.display = 'block';
				lobbyScreen.style.display = 'none';
				socket.emit('get_lobbies');
			}

			function updateLobbyUI(lobby) {
				// Обновить счетчик игроков
				playerCount.textContent = lobby.players.length;

				// Обновить список игроков
				playersList.innerHTML = '';
				lobby.players.forEach(player => {
					const item = document.createElement('div');
					item.className = 'player-item';
					const nameSpan = document.createElement('span');
					nameSpan.className = 'player-name';
					nameSpan.textContent = player.name;
					if (player.id === lobby.hostId) {
						const hostBadge = document.createElement('span');
						hostBadge.className = 'player-host';
						hostBadge.textContent = 'ХОСТ';
						nameSpan.appendChild(hostBadge);
					}
					item.appendChild(nameSpan);

					if (lobby.selectedMap === 2 && player.team) {
						const teamSpan = document.createElement('span');
						teamSpan.className = `player-team ${player.team}`;
						teamSpan.textContent = player.team === 'red' ? 'КРАСНЫЕ' : 'СИНИЕ';
						item.appendChild(teamSpan);
					} else if (lobby.selectedMap === 2) {
						const teamSpan = document.createElement('span');
						teamSpan.className = 'player-team none';
						teamSpan.textContent = 'НЕТ КОМАНДЫ';
						item.appendChild(teamSpan);
					}

					playersList.appendChild(item);
				});

				// Показать/скрыть контролы хоста
				hostControls.style.display = isHost ? 'block' : 'none';

				// Показать выбор команды для карты 2
				teamSection.style.display = lobby.selectedMap === 2 ? 'block' : 'none';

				// Обновить выбор карты
				document.querySelectorAll('.map-btn').forEach(btn => {
					btn.classList.toggle(
						'selected',
						parseInt(btn.dataset.map) === lobby.selectedMap,
					);
				});

				// Обновить чекбокс манекенов
				document.getElementById('enable-bots').checked = lobby.enableBots;

				// Кнопка старта (только для хоста)
				if (isHost) {
					const canStart =
						lobby.selectedMap === 1 || lobby.selectedMap === 3
							? lobby.players.length > 0
							: lobby.players.some(p => p.team === 'red') &&
								lobby.players.some(p => p.team === 'blue');
					startGameBtn.disabled = !canStart;
				} else {
					startGameBtn.style.display = 'none';
				}
			}

			function renderLobbiesList(lobbies) {
				lobbiesList.innerHTML = '';
				if (lobbies.length === 0) {
					lobbiesList.innerHTML =
						'<p style="text-align:center;color:#888;">Нет доступных лобби</p>';
					return;
				}
				lobbies.forEach(lobby => {
					const card = document.createElement('div');
					card.className = 'lobby-card';
					card.innerHTML = `
						<div class="lobby-card-header">
							<div class="lobby-id">${lobby.id}</div>
							<div class="lobby-players">${lobby.players.length}/${lobby.maxPlayers}</div>
						</div>
						<div class="lobby-map">Карта: ${lobby.selectedMap === 1 ? '🏟️ Арена' : '⚔️ Базы'}</div>
						<div class="lobby-host">Хост: ${lobby.players.find(p => p.id === lobby.hostId)?.name || 'N/A'}</div>
					`;
					card.addEventListener('click', () => {
						playerName = playerNameInput.value.trim();
						if (!playerName) {
							showStatus(statusMain, 'Введите ваше имя', 'error');
							return;
						}
						localStorage.setItem('playerName', playerName);
						socket.emit('join_lobby', { lobbyId: lobby.id, playerName });
					});
					lobbiesList.appendChild(card);
				});
			}

			function getMyTeam(lobby) {
				const me = lobby.players.find(p => p.id === socket.id);
				return me?.team || 'red';
			}

			function showStatus(element, message, type) {
				element.className = `status-message status-${type}`;
				element.textContent = message;
				element.classList.remove('hidden');
				setTimeout(() => element.classList.add('hidden'), 5000);
			}

			// Загрузить список лобби при старте
			socket.emit('get_lobbies');
		</script>
	</body>
</html>
